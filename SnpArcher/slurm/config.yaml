executor: slurm
use-conda: True
jobs: 150 # Have up to N jobs submitted at any given time
latency-wait: 100 # Wait N seconds for output files due to latency
#retries: 0 # Retry jobs N times.

# These resources will be applied to all rules. Can be overriden on a per-rule basis below.
default-resources:
  mem_mb: 64000 # old: attempt * 64000
  mem_mb_reduced: 60000 # old: (attempt * 64000) * 0.9 # Mem allocated to java (tries to prevent OOM errors)
  slurm_partition: "normal"
  slurm_account: "general"
  cpus_per_task: 4 # old: 16
  runtime: "48h"

